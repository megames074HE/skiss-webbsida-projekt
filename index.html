<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Umeyou</title>
</head>
<body>
    <header>
        <div class="header-content-left">
            <img class="header-logo" src="bilder/logo.png" alt="Umeyou logo">
            <img class="header-events-logo" src="bilder/music socialize events.png" alt="music, socialize, events">
        </div>
        <div class="header-content-right">
            <nav class="header-nav">
                <ul>
                    <li><a class="current-page-url" href="#">About us</a></li>
                    <li><a class="other-page-url" href="#">Events</a></li>
                    <li><a class="other-page-url" href="#">Find us</a></li>
                    <li><a class="other-page-url" href="#">FAQ</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <section class="hero-section">
        <div class="hero-background">
            <div class="hero-picture-container">
                <img src="bilder/BrorGunnarJansson.jpg" alt="BrorGunnarJannson coola grabbar">
            </div>
            <div class="hero-main-content">
                <div class="hero-text-content">
                    <img class="hero-upcoming-image" src="bilder/upcoming event.png" alt="upcoming events">
                    <h1>Bror Gunnar Jansson & The Escapism</h1>
                    <dl class="hero-text-date">
                        <dt>Saturday 17 Oct</dt>
                        <dt>20:00</dt>
                    </dl>

                </div>
                <div class="hero-info-buttons">
                        <a class="hero-more-info" href="#">More info</a>
                        <a class="hero-buy-tickets" href="#">Buy Tickets</a>
                </div>
            </div>

        </div>
    </section>


</body>
</html>
